services:
  - type: web
    name: adeyemi-samuel-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /portfolio
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WEB_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
